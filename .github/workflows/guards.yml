name: Guards

# Our own tools, run against this repo. If they are worth shipping they are worth
# depending on ourselves — a guard that never runs on our code is untested.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # ghas-free-pack uploads SARIF to code scanning and posts a PR comment.
  security-events: write
  pull-requests: write

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Our own tool. Locks the runner image's tool versions and diffs them when
      # GitHub bumps the image — including when a floating label like
      # ubuntu-latest silently re-points. Report-only; no fail-on yet.
      - name: Runner image drift
        uses: Booyaka101/runner-drift@v1

      - name: pnpm v11 CI guard
        uses: Booyaka101/pnpm11-ci-guard@v1
        with:
          mode: warn

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The lockfile lives in cli/ — the repo root is a schema registry with no
      # dependencies at all.
      - name: Install-script audit
        run: npx --yes npm-script-lens@latest audit --path ./cli
      # Version cooldown: npm worms are typically identified within hours, so
      # refuse to be among the first to install a brand-new version.
      - name: Dependency cooldown
        run: npx --yes npm-script-lens@latest audit --path . --cooldown

      # Shell/Dockerfile/Terraform/PHP — the file types GitHub gated behind paid
      # Advanced Security. Reports without gating, like the other guards.
      - name: Free GHAS-equivalent scan
        continue-on-error: true
        uses: Booyaka101/ghas-free-pack@v1
        with:
          github-token: ${{ github.token }}
