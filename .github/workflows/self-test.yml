# This repo's own CI: build the CLI and prove the acceptance checks hold,
# validating the test fixtures against the LOCAL schemas (--registry .).
name: self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. A second push supersedes the first instead of queueing
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Build CLI
        working-directory: cli
        run: npm install && npm run build
      # The acceptance suite is this repo's real gate: every check the steps here
      # used to spell out one at a time (index.json, valid/invalid fixtures, the
      # --migrate scans, the versions.json round-trip, the Nexus archive) plus the
      # real-mod corpus, the schema provenance assertions and the value gates.
      # It needs no network and no SDK tarball.
      - name: acceptance suite
        run: npm test
      # Informational only — tells us when Palworld or the SDK moves past the
      # registry (exit 1 = stale, exit 2 = network); never fails the build.
      - name: registry currency vs live game + SDK (informational)
        continue-on-error: true
        run: npm run versions:check
