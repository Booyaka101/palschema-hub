# Daily currency watch (06:00 UTC).
#
# This used to re-run build-items.mjs every week — but the upstream paldex dump
# is frozen at Jan-2024, so that re-derived identical data forever and HID the
# real staleness (the game moving on). Now it does two cheap checks and only
# opens an issue when something actually moved:
#
#   1. items.json source: compare the paldex dump file's latest commit sha
#      against the sha recorded in items.json._provenance.sourceCommit.
#      Changed => the upstream dump finally updated => regenerate items.json.
#   2. registry currency: scripts/check-currency.mjs against the live Steam
#      news API + PalworldModdingKit commits (exit 1 = stale, 2 = network).
#
# The version-alias job then ACTS on the one case that is fully derivable (a game
# patch that shipped no SDK header change) and opens the PR itself. Daily rather
# than weekly because a patch used to sit undetected for up to six days.
name: refresh-items

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  currency-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Upstream paldex dump SHA vs items.json._provenance.sourceCommit
        id: paldex
        run: |
          set -euo pipefail
          recorded=$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("items.json","utf8"))._provenance.sourceCommit || ""))')
          current=$(curl -sf -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/blaynem/paldex/commits?path=data-provider%2Fpalworld-assets%2FDataTable%2FItem%2FDT_ItemDataTable.json&per_page=1" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.stdout.write(JSON.parse(d)[0]?.sha||""))')
          echo "recorded=$recorded current=$current"
          if [ -n "$current" ] && [ "$current" != "$recorded" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$current" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue if the upstream dump updated
        if: steps.paldex.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="paldex dump updated — regenerate items.json"
          body=$(printf 'The upstream `blaynem/paldex` DT_ItemDataTable dump changed (now at `%s`; items.json records a different sourceCommit).\n\nRun `node scripts/build-items.mjs`, review the diff (row count, `_provenance`), update `DEFAULT_PROVENANCE` in the script if the dump'\''s game era changed, and commit.' "${{ steps.paldex.outputs.sha }}")
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "$body"
          fi

      - name: Registry currency vs live game + SDK
        id: currency
        run: |
          set +e
          out=$(npm run --silent versions:check 2>&1)
          code=$?
          set -e
          echo "$out"
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          {
            echo "line<<EOF"
            echo "$out" | tail -1
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # exit 2 (network) is not staleness — never open an issue for it.
          if [ "$code" != 0 ] && [ "$code" != 1 ]; then echo "transient failure (exit $code), ignoring"; fi

      - name: Open an issue if the registry is stale
        if: steps.currency.outputs.exit == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="registry stale: ${{ steps.currency.outputs.line }}"
          body=$(printf '`npm run versions:check` reports:\n\n```\n%s\n```\n\nIf only the GAME moved and `Source/Pal/Public` did not regenerate, the version-alias job in this same workflow opens the PR by itself (`npm run versions:bump`), so there is nothing to do here but review it.\n\nIf the SDK regenerated, the row structs really changed: pin the new commit in `versions.json` (order + versions), then `npm run snapshot:all && npm run diff:all && npm run seed && npm run check`, and read the diff before shipping.' "${{ steps.currency.outputs.line }}")
          if [ -z "$(gh issue list --state open --search "\"registry stale\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "$body"
          fi

  # The mechanical half of "a new Palworld patch shipped": when the game moved but
  # the SDK headers did NOT, the new label is an alias and every artifact under it
  # is derivable. bump-version.mjs verifies that against both live sources and
  # refuses (exit 3) the moment real header changes are involved — that case still
  # gets a human. Everything here lands as a PR, never a push to main.
  version-alias:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Alias bump (exit 0 wrote it, 3 needs a human, 4 nothing to do)
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/bump-version.mjs
          code=$?
          set -e
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "alias written — opening a PR" ;;
            3) echo "SDK regenerated: not an alias, the currency-watch issue covers it" ;;
            4) echo "nothing to do" ;;
            *) echo "no action taken (exit $code)" ;;
          esac

      # Gate the PR on the same suite CI would run. PRs opened with GITHUB_TOKEN
      # do not trigger other workflows, so if this suite does not run here it does
      # not run at all until a human pushes to the branch.
      - name: Acceptance tests
        if: steps.bump.outputs.exit == '0'
        run: |
          npm run cli:build
          npm test

      - name: Open the PR
        if: steps.bump.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          ALIAS_OF: ${{ steps.bump.outputs.alias_of }}
        run: |
          set -euo pipefail
          branch="auto/palworld-$VERSION-alias"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "a PR for $branch is already open"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add versions.json structs diffs
          git commit -F - <<COMMIT
          data: Palworld $VERSION aliases $ALIAS_OF (no SDK header change)

          Opened by refresh-items/version-alias. scripts/bump-version.mjs verified
          against the Steam news API (appid 1623730) and the PalworldModdingKit
          commit list that Source/Pal/Public did not regenerate for this patch, so
          the row structs are identical to $ALIAS_OF. Regenerated struct snapshots
          and pairwise diffs; the acceptance suite ran green before this commit.
          COMMIT
          git push -u origin "$branch"
          issue=$(gh issue list --state open --search '"registry stale" in:title' --json number --jq '.[0].number // empty')
          closes=""
          if [ -n "$issue" ]; then closes=$(printf 'Closes #%s\n\n' "$issue"); fi
          body=$(printf '%sPalworld **%s** shipped and `Source/Pal/Public` did not regenerate, so it is an alias of **%s**. The shas this was checked against are in `versions.json`, `aliases["%s"].aliasReason`.\n\nGenerated: the `versions.json` entry, `structs/%s.json`, and the `..%s` diffs. The acceptance suite ran green in the job that opened this PR. Note that self-test does NOT auto-run on PRs opened with `GITHUB_TOKEN`, so push a commit or close/reopen if you want its checks on record.\n\nStill human work, if it matters for this patch: the README alias caveat, `cli/README.md`, and CHANGELOG all name the alias list in prose.' \
            "$closes" "$VERSION" "$ALIAS_OF" "$VERSION" "$VERSION" "$VERSION")
          gh pr create --title "data: Palworld $VERSION aliases $ALIAS_OF (no SDK header change)" --body "$body"
